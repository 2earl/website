name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets live only in this environment: deploys from main only, each run approved by the owner.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate before deploying
        run: pnpm lint

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      - name: Smoke test
        run: |
          for path in / /privacy /terms /imprint; do
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 -o /dev/null "https://2earl.com${path}"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "::error::https://2earl.com${path} is not reachable"; exit 1; fi
            echo "ok ${path}"
          done
